# Alembic configuration for Teacher (CLI use: `uv run alembic upgrade head`).
# The database URL is NOT set here: migrations/env.py derives it from teacher.config.Settings
# ($TEACHER_DB: supabase (default, $SUPABASE_DB_URL) or sqlite; $TEACHER_HOME or the cwd), the
# root overridable with `-x root=/some/dir`.
# Application code uses teacher.db.migrate.upgrade_to_head(), which builds its Config in code.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
