[project]
name = "teacher"
version = "0.1.0"
description = "Local study tool: storage layer for knowledge sources and study artifacts."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.11.0",
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "jinja2>=3.1.6",
    "numpy>=2.5.5",
    "openai>=3.57.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2",
    "pypdf>=7.1.1",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.0",
    "usearch>=2.26.6",
    "uvicorn>=0.54.0",
    "youtube-transcript-api>=1.2.5",
]

[project.scripts]
teacher = "teacher.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
]
