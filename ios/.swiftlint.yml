# SwiftLint for the Airistotle app: /opt/homebrew/bin/swiftlint lint (from ios/).
included:
  - Airistotle
  - AiristotleTests
excluded:
  - Airistotle.xcodeproj
line_length:
  warning: 140
  error: 200
  ignores_comments: true
type_body_length:
  warning: 400
file_length:
  warning: 700
cyclomatic_complexity:
  warning: 16
  ignores_case_statements: true
function_body_length:
  warning: 80
identifier_name:
  excluded: [id, ok]
large_tuple:
  warning: 3
opt_in_rules:
  - empty_count
